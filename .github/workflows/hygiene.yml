name: hygiene

# PDK-free checks only: no PDK, ngspice, xschem or `klt sim` here. These are
# the same commands manifests/hygiene-inventory.json declares for T1 item 10,
# so the committed attestation (manifests/sky130-sram-compiler.item10.attest.json)
# is re-run on every PR and cannot go stale.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdk-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned klt
        run: pip install klayout-tools==0.8.0

      - name: JSON formats parse, Python sources compile
        run: python3 -I verification/hygiene/check_formats.py

      - name: Reproduce table covers every committed records/ directory
        run: python3 -I verification/hygiene/check_reproduce_coverage.py

      - name: Compiler generator tests
        run: python3 -I design/compiler/test_compiler.py

      - name: Schematics and 256x32 macro netlist match their generators
        run: |
          python3 -I design/compiler/gen_schematic.py --check
          python3 -I design/bitcell/gen_schematic.py --check
          python3 -I design/compiler/sram_compile.py 256 32 4 --check design/compiler/macro/sram_256x32_m4.spice

      - name: Bitcell testbenches and klt sim requests match their generator
        run: python3 -I sim/bitcell/lib/make_tb.py --check

      - name: Bitcell write-trip ladder seam tests
        run: python3 -I sim/bitcell/lib/test_record_common.py

      - name: Compiler ERC spec tests
        run: python3 -I design/compiler/test_erc_spec.py

      - name: Compiler layout tests
        run: python3 -I design/compiler/test_layout.py

      - name: Bitcell layout matches its generator (byte-identical GDS)
        run: python3 -I design/bitcell/gen_bitcell.py --check design/bitcell/bitcell_6t.gds

      - name: Column testbenches and klt sim requests match their generator
        run: python3 -I sim/column/lib/make_column_tb.py --check

      - name: --check gates actually bite (drift test)
        run: python3 -I verification/hygiene/test_check_gates.py

      - name: Reproduce-coverage gate actually bites (drift test)
        run: python3 -I verification/hygiene/test_reproduce_coverage.py

      - name: Format gate actually bites (drift test)
        run: python3 -I verification/hygiene/test_check_formats.py

      - name: Deck runners resolve the PDK variant DIR (regression test)
        run: python3 -I verification/hygiene/test_pdk_resolution.py

      - name: Graded DRC runner gates klt exits, writer validates before copying
        run: python3 -I verification/hygiene/test_drc_exit_gate.py

      - name: Item 10 attestation still reproduces
        run: |
          klt signoff --attest 10 --inventory manifests/hygiene-inventory.json \
              --check manifests/sky130-sram-compiler.item10.attest.json
